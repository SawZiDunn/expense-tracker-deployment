# Runs the expense tracker frontend and backend together.
#
# Usage (from the repository root):
#   cp .env.example .env    # then fill in MONGODB_CONNECTION_STRING
#   docker compose up --build
#
# Compose reads `.env` automatically for the variables referenced below.
services:
    backend:
        build:
            context: ./expense-tracker-backend
        image: expense-tracker-backend
        container_name: expense-tracker-backend
        ports:
            - "8080:8080" # Expose the backend API from the container to the host machine on port 8080
        environment:
            PORT: 8080
            ASPNETCORE_ENVIRONMENT: Production
            MONGODB_CONNECTION_STRING: ${MONGODB_CONNECTION_STRING}
            # Origin the browser uses to reach the frontend (for CORS)
            FRONTEND_URL: ${FRONTEND_URL}
        restart: unless-stopped
    
    frontend:
        build:
            context: ./expense-tracker-frontend
            args:
                # Must be reachable from the browser, not just the container network
                VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        image: expense-tracker-frontend
        container_name: expense-tracker-frontend
        ports:
            - "3000:80" # Expose the frontend from the container to the host machine on port 3000
        depends_on:
            - backend
        restart: unless-stopped
